# Accepted Trivy findings. Every entry needs a reason; vulnerability entries expire so they
# are re-assessed (normally a newer upstream image makes them disappear first).

vulnerabilities:
  # Default/bundled gems of the ruby:4.0.5-alpine base inside docuseal/docuseal:3.3.3. The app
  # does not load them: Bundler activates json 2.21.2 and net-imap 0.6.6 from /usr/local/bundle
  # (verified with `bundle exec ruby -e 'puts JSON::VERSION, Net::IMAP::VERSION'`).
  - id: CVE-2026-33210
    paths:
      - "usr/local/lib/ruby/gems/4.0.0/specifications/default/json-2.18.0.gemspec"
    statement: Shadowed default gem; the application loads json 2.21.2 (fixed).
    expired_at: 2026-12-31
  - id: CVE-2026-42257
    paths:
      - "usr/local/lib/ruby/gems/4.0.0/specifications/net-imap-0.6.2.gemspec"
    statement: Shadowed bundled gem; the application loads net-imap 0.6.6 (fixed).
    expired_at: 2026-12-31
